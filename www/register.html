<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:3000 http://10.0.2.2:3000;">
<title>Create account — Student Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="profile-header">
    <h1>Student Profile</h1>
    <p class="subtitle">Create your account</p>
  </header>

  <main id="main-content">
    <section class="profile-edit auth-card">
      <h2>Register</h2>

      <form id="auth-form" data-mode="register" novalidate>
        <div class="form-group">
          <label for="studentId">Student ID</label>
          <input type="text" id="studentId" autocomplete="username" autocapitalize="none">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" autocapitalize="none">
        </div>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="course">Course</label>
          <input type="text" id="course" placeholder="e.g. BS Information Technology">
        </div>

        <div class="form-group">
          <label for="year">Year Level</label>
          <input type="text" id="year" placeholder="e.g. 4th Year">
        </div>

        <div class="form-group">
          <label for="password">Password <span class="field-hint">at least 8 characters</span></label>
          <input type="password" id="password" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" autocomplete="new-password">
        </div>

        <p class="form-feedback" id="auth-feedback" role="alert"></p>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="auth-submit">Create Account</button>
        </div>
      </form>

      <p class="auth-switch">Already registered? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <footer>
    &copy; 2026 Jose Gabriel Y. Cortez. All rights reserved.
  </footer>

  <script src="api.js"></script>
  <script src="auth.js"></script>

</body>
</html>
