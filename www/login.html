<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:3000 http://10.0.2.2:3000;">
<title>Log in — Student Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="profile-header">
    <h1>Student Profile</h1>
    <p class="subtitle">Log in to continue</p>
  </header>

  <main id="main-content">
    <section class="profile-edit auth-card">
      <h2>Log In</h2>

      <form id="auth-form" data-mode="login" novalidate>
        <div class="form-group">
          <label for="identifier">Student ID or Email</label>
          <input type="text" id="identifier" autocomplete="username" autocapitalize="none">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password">
        </div>

        <p class="form-feedback" id="auth-feedback" role="alert"></p>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="auth-submit">Log In</button>
        </div>
      </form>

      <p class="auth-switch">No account yet? <a href="register.html">Create one</a></p>
    </section>
  </main>

  <footer>
    &copy; 2026 Jose Gabriel Y. Cortez. All rights reserved.
  </footer>

  <script src="api.js"></script>
  <script src="auth.js"></script>

</body>
</html>
